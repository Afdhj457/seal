<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>海豹建模 - 3D 海豹 (GLB 下载)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            font-size: 16px;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }
        #instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
        }
        #download-panel {
            position: absolute;
            bottom: 80px;
            right: 30px;
            background: rgba(30, 40, 50, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px 22px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 200;
            pointer-events: auto;
            font-size: 15px;
            min-width: 170px;
        }
        #download-panel h4 {
            margin: 0 0 5px 0;
            font-weight: 400;
            text-align: center;
            color: #aaddff;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            font-size: 16px;
        }
        .btn-download {
            background: rgba(70, 130, 200, 0.9);
            border: none;
            color: white;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-download:hover {
            background: rgba(90, 160, 240, 1);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
        }
        .btn-download:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        .btn-download.glb {
            background: rgba(110, 80, 180, 0.9);
        }
        .btn-download.glb:hover {
            background: rgba(130, 100, 210, 1);
        }
        #download-tip {
            font-size: 12px;
            text-align: center;
            color: #ccddee;
            opacity: 0.85;
            margin-top: 4px;
        }
        #loading-message {
            font-size: 13px;
            text-align: center;
            color: #ffdd88;
            min-height: 20px;
            transition: opacity 0.3s;
        }
        @media (max-width: 600px) {
            #download-panel {
                bottom: 100px;
                right: 15px;
                left: 15px;
                width: auto;
                padding: 16px;
            }
            #info {
                top: 10px;
                left: 10px;
                font-size: 14px;
                padding: 8px 16px;
            }
            #instruction {
                bottom: 10px;
                font-size: 12px;
                padding: 6px 12px;
                white-space: normal;
                text-align: center;
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div id="info">🦭 海豹建模 | 拖拽旋转 / 滚轮缩放</div>
    <div id="instruction">鼠标拖动查看 | 滚动缩放 | 点击右侧按钮下载 GLB 模型</div>

    <div id="download-panel">
        <h4>⬇ 下载模型</h4>
        <button id="download-glb" class="btn-download glb">
            <span>🦭</span> 导出 GLB 格式
        </button>
        <div id="loading-message"></div>
        <div id="download-tip">GLB 包含材质与几何体，适合 3D 软件/引擎</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0d8ef);
        scene.fog = new THREE.Fog(0xa0d8ef, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 10);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 5;
        controls.maxDistance = 25;

        // --- 灯光设置 ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        mainLight.position.set(8, 12, 8);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 15;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 30;
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        const fillLight1 = new THREE.PointLight(0xffaa88, 0.5);
        fillLight1.position.set(-5, 3, 5);
        scene.add(fillLight1);

        const fillLight2 = new THREE.PointLight(0x88aaff, 0.4);
        fillLight2.position.set(5, 2, -5);
        scene.add(fillLight2);

        const backLight = new THREE.PointLight(0x88ccff, 0.3);
        backLight.position.set(-3, 1, -8);
        scene.add(backLight);

        // --- 地面 ---
        const groundGeometry = new THREE.CircleGeometry(15, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x8cb8d4, 
            roughness: 0.8, 
            metalness: 0.1,
            transparent: true,
            opacity: 0.7
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(20, 20, 0xffffff, 0x88aacc);
        gridHelper.position.y = 0;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.2;
        scene.add(gridHelper);

        // 粒子
        const particleCount = 400;
        const particlesGeo = new THREE.BufferGeometry();
        const particlesPos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlesPos[i*3] = (Math.random() - 0.5) * 40;
            particlesPos[i*3+1] = Math.random() * 15;
            particlesPos[i*3+2] = (Math.random() - 0.5) * 40;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPos, 3));
        const particlesMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.1,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        // --- 创建海豹模型 ---
        const sealGroup = new THREE.Group();

        const sealBodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x7a9eb3,
            roughness: 0.6, 
            metalness: 0.1,
            emissive: new THREE.Color(0x223344),
            emissiveIntensity: 0.1
        });
        
        const sealBellyMat = new THREE.MeshStandardMaterial({ 
            color: 0xc0d0dd,
            roughness: 0.7, 
            metalness: 0.05
        });

        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.2, emissive: new THREE.Color(0x222233) });
        const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const noseMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4 });
        const whiskerMat = new THREE.LineBasicMaterial({ color: 0xeeeeee });

        // 身体
        const bodyGeo = new THREE.SphereGeometry(1, 32, 32);
        const body = new THREE.Mesh(bodyGeo, sealBodyMat);
        body.scale.set(2.2, 1.0, 1.4);
        body.position.set(0, 1.0, 0);
        body.castShadow = true;
        body.receiveShadow = true;
        sealGroup.add(body);

        // 肚子
        const bellyGeo = new THREE.SphereGeometry(0.9, 24, 24);
        const belly = new THREE.Mesh(bellyGeo, sealBellyMat);
        belly.scale.set(1.8, 0.8, 1.0);
        belly.position.set(0, 0.85, 0.6);
        belly.castShadow = true;
        belly.receiveShadow = true;
        sealGroup.add(belly);

        // 头部
        const headGeo = new THREE.SphereGeometry(0.75, 32, 32);
        const head = new THREE.Mesh(headGeo, sealBodyMat);
        head.scale.set(1.0, 0.9, 0.9);
        head.position.set(1.9, 1.25, 0.1);
        head.castShadow = true;
        head.receiveShadow = true;
        sealGroup.add(head);

        // 吻部
        const snoutGeo = new THREE.SphereGeometry(0.4, 24, 24);
        const snout = new THREE.Mesh(snoutGeo, sealBellyMat);
        snout.scale.set(0.8, 0.6, 0.7);
        snout.position.set(2.45, 1.0, 0.1);
        snout.castShadow = true;
        snout.receiveShadow = true;
        sealGroup.add(snout);

        // 鼻子
        const noseGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(2.75, 1.05, 0.1);
        nose.castShadow = true;
        sealGroup.add(nose);

        // 眼睛
        const eyeGeo = new THREE.SphereGeometry(0.14, 16, 16);
        const eyeWhiteGeo = new THREE.SphereGeometry(0.16, 16, 16);

        // 左眼
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(2.05, 1.4, -0.4);
        eyeL.castShadow = true;
        sealGroup.add(eyeL);
        const eyeWhiteL = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
        eyeWhiteL.position.set(2.02, 1.42, -0.43);
        eyeWhiteL.scale.set(0.9, 0.9, 0.9);
        eyeWhiteL.castShadow = true;
        sealGroup.add(eyeWhiteL);
        const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        pupilL.position.set(2.08, 1.44, -0.44);
        pupilL.castShadow = true;
        sealGroup.add(pupilL);

        // 右眼
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(2.05, 1.4, 0.6);
        eyeR.castShadow = true;
        sealGroup.add(eyeR);
        const eyeWhiteR = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
        eyeWhiteR.position.set(2.02, 1.42, 0.63);
        eyeWhiteR.scale.set(0.9, 0.9, 0.9);
        eyeWhiteR.castShadow = true;
        sealGroup.add(eyeWhiteR);
        const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        pupilR.position.set(2.08, 1.44, 0.64);
        pupilR.castShadow = true;
        sealGroup.add(pupilR);

        // 胡须
        const whiskerPoints = [
            [2.7, 1.0, 0.25], [3.0, 0.95, 0.2], [3.2, 0.9, 0.15],
            [2.7, 0.95, -0.05], [3.0, 0.9, -0.1], [3.2, 0.85, -0.15],
            [2.7, 0.85, 0.15], [3.0, 0.8, 0.1], [3.2, 0.75, 0.05],
            [2.7, 0.9, -0.2], [3.0, 0.85, -0.25], [3.2, 0.8, -0.3]
        ];
        whiskerPoints.forEach(([x, y, z]) => {
            const points = [
                new THREE.Vector3(x, y, z),
                new THREE.Vector3(x + 0.5, y - 0.15, z * 1.1)
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, whiskerMat);
            sealGroup.add(line);
        });

        // 鳍状肢
        const flipperGeo = new THREE.SphereGeometry(0.5, 24, 24);
        const flipperMat = new THREE.MeshStandardMaterial({ color: 0x6a8fa8, roughness: 0.6 });

        const flipperFrontL = new THREE.Mesh(flipperGeo, flipperMat);
        flipperFrontL.scale.set(0.8, 0.3, 0.5);
        flipperFrontL.position.set(1.2, 0.8, -1.0);
        flipperFrontL.rotation.z = 0.3;
        flipperFrontL.rotation.x = 0.4;
        flipperFrontL.rotation.y = -0.3;
        flipperFrontL.castShadow = true;
        flipperFrontL.receiveShadow = true;
        sealGroup.add(flipperFrontL);

        const flipperFrontR = new THREE.Mesh(flipperGeo, flipperMat);
        flipperFrontR.scale.set(0.8, 0.3, 0.5);
        flipperFrontR.position.set(1.2, 0.8, 1.2);
        flipperFrontR.rotation.z = 0.3;
        flipperFrontR.rotation.x = -0.4;
        flipperFrontR.rotation.y = 0.3;
        flipperFrontR.castShadow = true;
        flipperFrontR.receiveShadow = true;
        sealGroup.add(flipperFrontR);

        // 后鳍
        const tailGeo = new THREE.SphereGeometry(0.6, 24, 24);
        
        const tailL = new THREE.Mesh(tailGeo, flipperMat);
        tailL.scale.set(0.9, 0.25, 0.6);
        tailL.position.set(-2.4, 0.9, -0.7);
        tailL.rotation.z = -0.2;
        tailL.rotation.y = -0.5;
        tailL.rotation.x = 0.3;
        tailL.castShadow = true;
        tailL.receiveShadow = true;
        sealGroup.add(tailL);

        const tailR = new THREE.Mesh(tailGeo, flipperMat);
        tailR.scale.set(0.9, 0.25, 0.6);
        tailR.position.set(-2.4, 0.9, 0.7);
        tailR.rotation.z = -0.2;
        tailR.rotation.y = 0.5;
        tailR.rotation.x = -0.3;
        tailR.castShadow = true;
        tailR.receiveShadow = true;
        sealGroup.add(tailR);

        const tailCenter = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), sealBodyMat);
        tailCenter.scale.set(0.8, 0.6, 0.8);
        tailCenter.position.set(-2.0, 0.9, 0);
        tailCenter.castShadow = true;
        tailCenter.receiveShadow = true;
        sealGroup.add(tailCenter);

        sealGroup.position.y = 0.2;
        sealGroup.position.x = -0.5;
        scene.add(sealGroup);

        // 装饰雪堆
        const snowGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const snowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, emissive: new THREE.Color(0x6688aa), emissiveIntensity: 0.1 });
        const snow = new THREE.Mesh(snowGeo, snowMat);
        snow.scale.set(1.5, 0.3, 1.5);
        snow.position.set(-2, 0.15, -1.5);
        snow.receiveShadow = true;
        snow.castShadow = true;
        scene.add(snow);

        const snow2 = new THREE.Mesh(snowGeo, snowMat);
        snow2.scale.set(1.2, 0.4, 1.2);
        snow2.position.set(3, 0.2, 2);
        snow2.receiveShadow = true;
        snow2.castShadow = true;
        scene.add(snow2);

        // --- CSS2D 标签 ---
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const labelDiv = document.createElement('div');
        labelDiv.textContent = '🦭 海豹';
        labelDiv.style.color = 'white';
        labelDiv.style.fontSize = '20px';
        labelDiv.style.fontWeight = 'bold';
        labelDiv.style.textShadow = '2px 2px 4px black';
        labelDiv.style.background = 'rgba(0,0,0,0.3)';
        labelDiv.style.padding = '4px 12px';
        labelDiv.style.borderRadius = '20px';
        labelDiv.style.backdropFilter = 'blur(3px)';
        labelDiv.style.border = '1px solid rgba(255,255,255,0.3)';
        
        const labelObj = new CSS2DObject(labelDiv);
        labelObj.position.set(0, 2.5, 0);
        sealGroup.add(labelObj);

        // --- GLB 导出功能 ---
        const downloadBtn = document.getElementById('download-glb');
        const loadingMsg = document.getElementById('loading-message');

        downloadBtn.addEventListener('click', () => {
            // 显示加载提示
            loadingMsg.textContent = '正在生成 GLB，请稍候...';
            loadingMsg.style.color = '#ffdd88';
            downloadBtn.disabled = true;
            downloadBtn.style.opacity = '0.7';
            downloadBtn.style.cursor = 'wait';

            // 临时移除 CSS2DObject 标签（因为标签是 HTML 元素，GLTFExporter 无法导出，且会导致错误）
            sealGroup.remove(labelObj);

            // 创建 GLTFExporter 实例
            const exporter = new GLTFExporter();

            // 导出选项：二进制 GLB，包含材质和几何体
            const options = {
                binary: true,           // 输出为 GLB 二进制格式
                embedImages: true,      // 嵌入任何纹理（本模型无纹理，但保留选项）
                maxTextureSize: 2048,   // 纹理最大尺寸限制
                includeCustomExtensions: false,
                animations: []           // 无动画
            };

            // 执行导出 (传入海豹组)
            exporter.parse(sealGroup, (result) => {
                // 导出成功，result 为 ArrayBuffer (binary: true)
                const blob = new Blob([result], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'seal_model.glb';
                link.click();
                
                // 清理 URL 对象
                URL.revokeObjectURL(link.href);

                // 恢复标签
                sealGroup.add(labelObj);

                // 恢复按钮状态
                loadingMsg.textContent = '✅ GLB 下载完成！';
                loadingMsg.style.color = '#aaffaa';
                downloadBtn.disabled = false;
                downloadBtn.style.opacity = '1';
                downloadBtn.style.cursor = 'pointer';

                // 3 秒后清除提示
                setTimeout(() => {
                    loadingMsg.textContent = '';
                }, 3000);
            }, (error) => {
                // 导出失败
                console.error('GLB 导出错误:', error);
                loadingMsg.textContent = '❌ 导出失败，请重试';
                loadingMsg.style.color = '#ff8888';
                
                // 恢复标签
                sealGroup.add(labelObj);

                // 恢复按钮状态
                downloadBtn.disabled = false;
                downloadBtn.style.opacity = '1';
                downloadBtn.style.cursor = 'pointer';

                setTimeout(() => {
                    loadingMsg.textContent = '';
                }, 3000);
            }, options);
        });

        // 额外的辅助：在控制台提示 GLB 导出就绪
        console.log('海豹建模已加载，支持导出 GLB 格式！');

        // --- 动画循环 ---
        let clock = new THREE.Clock();

        function animate() {
            const elapsedTime = performance.now() * 0.001;

            controls.update();

            // 海豹轻微浮动
            sealGroup.position.y = 0.2 + Math.sin(elapsedTime * 2) * 0.05;

            // 粒子旋转
            particles.rotation.y += 0.0005;

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        animate();

        // --- 窗口大小自适应 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 交互暂停自动旋转
        renderer.domElement.addEventListener('mousedown', () => {
            controls.autoRotate = false;
        });
        renderer.domElement.addEventListener('mouseup', () => {
            setTimeout(() => {
                if (!controls.autoRotate) {
                    controls.autoRotate = true;
                }
            }, 5000);
        });
        renderer.domElement.addEventListener('touchstart', () => {
            controls.autoRotate = false;
        });
        renderer.domElement.addEventListener('touchend', () => {
            setTimeout(() => {
                if (!controls.autoRotate) {
                    controls.autoRotate = true;
                }
            }, 5000);
        });
    </script>
</body>
</html>
